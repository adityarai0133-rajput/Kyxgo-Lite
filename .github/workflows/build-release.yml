name: Build Kyxgo Lite EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyInstaller and pypdf
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pypdf

      - name: Build Standalone EXE
        run: pyinstaller --noconfirm --onefile --name "KyxgoLite" kyxgo_app.py

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KyxgoLite-Windows
          path: dist/KyxgoLite.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KyxgoLite.exe
          generate_release_notes: true
          
